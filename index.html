<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BlackTeaMC的鬼点子</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #fff;
            text-align: center;
        }
        /* 主页面（初始隐藏） */
        .main-content {
            display: none;
            padding-top: 40px;
        }
        .main-content h1 { font-size: 26px; }
        .main-content p { font-size: 16px; color: #555; }
        .main-content button {
            padding: 12px 28px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }

        /* 年龄验证弹窗（默认显示） */
        .age-verify-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 998;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .age-verify-box {
            background: #fff;
            width: 85%;
            max-width: 380px;
            padding: 30px 20px;
            border-radius: 10px;
            text-align: center;
        }
        .warning-icon { font-size: 64px; margin-bottom: 10px; }
        .age-text { font-size: 16px; color: #333; margin-bottom: 25px; line-height: 1.6; }
        .btn-group { display: flex; justify-content: space-around; gap: 15px; }
        .btn-confirm, .btn-reject {
            flex: 1;
            color: #fff;
            border: none;
            padding: 12px 0;
            font-size: 17px;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-confirm { background: #28a745; }
        .btn-reject { background: #dc3545; }

        /* 人机验证界面（初始隐藏） */
        .captcha-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            z-index: 997;
            justify-content: center;
            align-items: center;
        }
        .captcha-box {
            background: #fff;
            width: 90%;
            max-width: 360px;
            padding: 25px 20px 20px;
            border-radius: 12px;
            text-align: center;
        }
        .captcha-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .captcha-hint {
            font-size: 13px;
            color: #888;
            margin-bottom: 15px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 280px;
            margin: 0 auto 20px;
        }
        .grid-cell {
            aspect-ratio: 1 / 1;
            background: #f0f0f0;
            border: 2px solid #ccc;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
        }
        .grid-cell.selected {
            background: #28a745;
            color: #fff;
            border-color: #28a745;
            cursor: default;
        }
        .grid-cell.wrong {
            background: #dc3545;
            color: #fff;
            border-color: #dc3545;
            animation: shake 0.3s;
        }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
        .captcha-status {
            font-size: 14px;
            min-height: 22px;
            margin-bottom: 10px;
        }
        .captcha-status.error { color: #dc3545; }
        .captcha-status.success { color: #28a745; }
        .captcha-reset-btn {
            background: #6c757d;
            color: #fff;
            border: none;
            padding: 8px 24px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<!-- 主页面（验证通过后显示） -->
<div class="main-content" id="mainContent">
    <h1>🎉 验证成功！</h1>
    <p>欢迎来到 BlackTeaMC 的专属整活空间！</p>
    <button onclick="alert('准备开始你的鬼点子吧！')">开始探索</button>
</div>

<!-- 年龄验证弹窗 -->
<div class="age-verify-overlay" id="ageOverlay">
    <div class="age-verify-box">
        <div class="warning-icon">⚠️</div>
        <div class="age-text">请确认您是否已满18周岁？<br>访问本网站需要您成年。</div>
        <div class="btn-group">
            <button class="btn-confirm" onclick="onAgeConfirm()">确认</button>
            <button class="btn-reject" onclick="onAgeReject()">拒绝</button>
        </div>
    </div>
</div>
