<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlackTeaMC的鬼点子</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: #ffffff;
            text-align: center;
        }
        
        /* 初始页面样式 */
        .initial-screen {
            padding-top: 50px;
        }
        
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }

        /* 18+ 验证弹窗遮罩（黑底） */
        .age-verify-overlay {
            display: none; /* 默认隐藏 */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            z-index: 999;
            justify-content: center;
            align-items: center;
        }

        /* 白色内容区域 */
        .age-verify-box {
            background-color: #ffffff;
            width: 80%;
            max-width: 400px;
            padding: 30px 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* 黄色警告图标 */
        .warning-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        /* 提示文字 */
        .age-text {
            font-size: 16px;
            color: #333333;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* 按钮容器 */
        .btn-group {
            display: flex;
            justify-content: space-around;
        }

        /* 确认和拒绝按钮 */
        .btn-confirm, .btn-reject {
            color: #ffffff;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 0;
        }

        .btn-confirm {
            background-color: #28a745; /* 绿底 */
        }

        .btn-reject {
            background-color: #dc3545; /* 红底 */
        }
    </style>
</head>
<body>

    <!-- 初始页面 -->
    <div class="initial-screen" id="initialScreen">
        <h1>🎉 验证成功！</h1>
        <p>欢迎来到 BlackTeaMC 的专属整活空间！</p>
        <button onclick="startExplore()">开始探索</button>
    </div>

    <!-- 18+ 验证弹窗 -->
    <div class="age-verify-overlay" id="ageVerifyOverlay">
        <div class="age-verify-box">
            <div class="warning-icon">⚠️</div>
            <div class="age-text">请确认您是否已满18周岁？<br>访问本网站需要您成年。</div>
            <div class="btn-group">
                <button class="btn-confirm" onclick="confirmAge()">确认</button>
                <button class="btn-reject" onclick="rejectAge()">拒绝</button>
            </div>
        </div>
    </div>

    <script>
        // 点击“开始探索”触发
        function startExplore() {
            // 显示黑底弹窗
            document.getElementById('ageVerifyOverlay').style.display = 'flex';
        }

        // 点击“确认”
        function confirmAge() {
            alert('准备开始你的鬼点子吧！');
            // 这里可以加跳转代码，比如：window.location.href = 'https://www.baidu.com';
        }

        // 点击“拒绝”
        function rejectAge() {
            alert('抱歉，未成年人无法访问本网站！');
            // 拒绝后关闭弹窗并退回初始页面
            document.getElementById('ageVerifyOverlay').style.display = 'none';
        }
    </script>
</body>
</html>
